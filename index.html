<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Concorso - Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="max-w-3xl w-full bg-slate-900/90 border border-slate-800 rounded-3xl shadow-2xl backdrop-blur-xl overflow-hidden flex flex-col min-h-[500px]">
    
    <!-- Barra di Progresso -->
    <div class="h-1.5 w-full bg-slate-800">
      <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-500 w-0"></div>
    </div>

    <div class="absolute right-4 top-3 text-[10px] tracking-[0.2em] uppercase text-slate-500">v0.3 • 05.09.2026</div>

    <!-- Header -->
    <div id="quiz-header" class="p-6 border-b border-slate-800/80 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span id="question-badge" class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-3 py-1 rounded-full text-xs font-semibold tracking-wide">
          Domanda 1/5
        </span>
      </div>

      <div class="flex items-center gap-1.5 text-[10px] sm:text-xs text-slate-300">
        <div class="inline-flex items-center gap-1 bg-slate-800/70 rounded-full px-1.5 py-0.5 transition-all duration-200">
          <span class="relative inline-flex h-1.5 w-1.5">
            <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400/60 animate-ping"></span>
            <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-400"></span>
          </span>
          <span class="text-slate-200">Online</span>
          <strong id="online-users" class="text-emerald-300 min-w-[0.9rem] text-center">0</strong>
        </div>
        <div id="total-badge" class="inline-flex items-center gap-1 bg-slate-800/70 rounded-full px-1.5 py-0.5 transition-all duration-200">
          <span class="inline-block h-1.5 w-1.5 rounded-full bg-blue-400"></span>
          <span class="text-slate-200">Quiz</span>
          <strong id="total-completed" class="text-blue-300 min-w-[0.9rem] text-center">21</strong>
        </div>
      </div>

      <div class="flex items-center gap-4 text-sm font-medium">
        <div class="flex items-center gap-1.5 text-slate-400">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span id="timer">00:00</span>
        </div>
        
        <!-- Selettore domande -->
        <select id="q-count-select" onchange="restartQuiz()" class="bg-slate-800 border border-slate-700 text-xs text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-blue-500 transition-colors">
          <option value="5">5 Domande</option>
          <option value="10">10 Domande</option>
          <option value="20">20 Domande</option>
        </select>

      <button onclick="restartQuiz()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Riavvia
      </button>
      </div>
    </div>

    <!-- Area Principale Quiz -->
    <div id="quiz-body" class="p-6 md:p-8 flex-1 flex flex-col justify-between">
      
      <div>
        <h2 id="question-text" class="text-lg md:text-xl font-semibold text-slate-100 leading-relaxed mb-6">
          Caricamento delle domande...
        </h2>

        <div id="options-container" class="space-y-3">
          <!-- Opzioni caricate via JS -->
        </div>
      </div>

      <!-- Footer / Bottone Avanti -->
      <div class="mt-8 pt-4 border-t border-slate-800/60 flex justify-between items-center gap-4">
        <div id="score-counter" class="text-xs text-slate-400 font-medium">
          Punteggio: <span id="current-score" class="text-slate-200 font-bold">0</span>
        </div>
        <div id="json-id-badge" class="text-[10px] uppercase tracking-[0.18em] text-slate-500 bg-slate-800/70 px-2 py-1 rounded-full border border-slate-700">
          ID: #--
        </div>
        <div id="database-badge" class="text-[10px] uppercase tracking-[0.18em] text-slate-500 bg-slate-800/70 px-2 py-1 rounded-full border border-slate-700">DB: cancellieri-2017.csv</div>
        <button id="next-btn" onclick="nextQuestion()" class="hidden bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition-all duration-200 shadow-lg shadow-blue-500/20 flex items-center gap-2 text-sm">
          <span>Prossima</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </div>
    </div>

    <!-- Schermata Finale & Report -->
    <div id="result-screen" class="hidden p-6 md:p-8 space-y-6">
      <div class="text-center space-y-3">
        <div class="inline-flex p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-emerald-400 mb-2">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h2 class="text-2xl md:text-3xl font-bold text-slate-100">Test Completato!</h2>
        <p id="final-stats" class="text-sm text-slate-400 max-w-md mx-auto"></p>
      </div>

      <!-- Percentuale Score Card -->
      <div class="grid grid-cols-3 gap-3 bg-slate-950/60 border border-slate-800 p-4 rounded-2xl text-center">
        <div>
          <span class="block text-xs text-slate-500 uppercase font-semibold">Corrette</span>
          <span id="stat-correct" class="text-xl font-bold text-emerald-400">0</span>
        </div>
        <div>
          <span class="block text-xs text-slate-500 uppercase font-semibold">Accuratezza</span>
          <span id="stat-accuracy" class="text-xl font-bold text-blue-400">0%</span>
        </div>
        <div>
          <span class="block text-xs text-slate-500 uppercase font-semibold">Tempo</span>
          <span id="stat-time" class="text-xl font-bold text-indigo-400">00:00</span>
        </div>
      </div>

      <!-- Revisione Dettagliata Risposte -->
      <div class="space-y-3 max-h-60 overflow-y-auto pr-1" id="review-container">
        <!-- Generato via JS -->
      </div>

      <button onclick="restartQuiz()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-blue-500/20 text-sm">
        Ricomincia Nuovo Test
      </button>
    </div>

  </div>

  <script>
    const DATABASE_FILE = 'cancellieri-2017.csv';
    const SUPABASE_URL = 'https://cambypeevswkggrdsbtv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uqP-gxG8nJJDw82ppmURUg_bIk5WJCu';
    const GEMINI_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/gemini-explain`;
    const HEARTBEAT_MS = 15000;
    const SESSION_TIMEOUT_MS = 30000;
    const SESSION_STORAGE_KEY = 'quiz_concorso_session_id';
    const INITIAL_COMPLETED_COUNT = 21;
    const sessionId = localStorage.getItem(SESSION_STORAGE_KEY) || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    localStorage.setItem(SESSION_STORAGE_KEY, sessionId);

    let allQuestions = [];
    let currentQuizQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let timerInterval = null;
    let secondsElapsed = 0;
    let userHistory = [];
    let heartbeatTimer = null;
    let presenceStarted = false;
    let presenceRequestInFlight = false;

    function supabaseHeaders() {
      return {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      };
    }

    async function upsertSession() {
      if (!SUPABASE_URL || !SUPABASE_KEY || presenceRequestInFlight) return;

      presenceRequestInFlight = true;
      const payload = [{
        session_id: sessionId,
        last_seen: new Date().toISOString()
      }];

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_sessions?on_conflict=session_id`, {
          method: 'POST',
          headers: supabaseHeaders(),
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          console.warn('Errore upsert session:', response.statusText);
        }
      } catch (error) {
        console.warn('Session sync failed:', error);
      } finally {
        presenceRequestInFlight = false;
      }
    }

    async function pruneInactiveSessions() {
      if (!SUPABASE_URL || !SUPABASE_KEY || presenceRequestInFlight) return;
      try {
        const cutoff = new Date(Date.now() - SESSION_TIMEOUT_MS).toISOString();
        await fetch(`${SUPABASE_URL}/rest/v1/quiz_sessions?last_seen=lt.${cutoff}`, {
          method: 'DELETE',
          headers: supabaseHeaders()
        });
      } catch (error) {
        console.warn('Prune sessions failed:', error);
      }
    }

    async function refreshOnlineUsers() {
      if (!SUPABASE_URL || !SUPABASE_KEY || presenceRequestInFlight) {
        return;
      }

      try {
        const cutoff = new Date(Date.now() - SESSION_TIMEOUT_MS).toISOString();
        const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_sessions?select=session_id&last_seen=gte.${cutoff}`, {
          headers: supabaseHeaders()
        });

        if (!response.ok) {
          throw new Error('online count fetch failed');
        }

        const rows = await response.json();
        const onlineCount = Array.isArray(rows) ? rows.length : 0;
        const onlineNode = document.getElementById('online-users');
        const prevValue = Number(onlineNode?.dataset.value || '0');
        onlineNode.innerText = String(onlineCount);
        onlineNode.dataset.value = String(onlineCount);

        if (onlineCount > 1 && onlineCount !== prevValue) {
          pulseBadge('online-users');
        }
      } catch (error) {
        console.warn('Online users failed:', error);
        const onlineNode = document.getElementById('online-users');
        if (onlineNode) {
          onlineNode.innerText = '0';
          onlineNode.dataset.value = '0';
        }
      }
    }

    function pulseBadge(badgeId) {
      const badge = document.getElementById(badgeId);
      if (!badge) return;
      badge.classList.remove('scale-100');
      badge.classList.add('scale-105', 'ring-1', 'ring-emerald-400/30');
      setTimeout(() => {
        badge.classList.remove('scale-105', 'ring-1', 'ring-emerald-400/30');
        badge.classList.add('scale-100');
      }, 180);
    }

    function updateTotalBadge(value) {
      const totalBadge = document.getElementById('total-badge');
      const totalNode = document.getElementById('total-completed');
      if (!totalBadge || !totalNode) return;

      const numericValue = Number(value) || 0;
      totalBadge.classList.remove('hidden');
      totalBadge.classList.add('inline-flex');

      const prevValue = Number(totalNode.dataset.value || '0');
      totalNode.innerText = String(numericValue);
      totalNode.dataset.value = String(numericValue);

      if (numericValue > prevValue) {
        pulseBadge('total-badge');
      }
    }

    async function refreshGlobalQuizCounter() {
      if (!SUPABASE_URL || !SUPABASE_KEY) {
        updateTotalBadge(INITIAL_COMPLETED_COUNT);
        return;
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_stats?select=value&key=eq.total_completed`, {
          headers: supabaseHeaders()
        });

        if (!response.ok) {
          throw new Error('stats fetch failed');
        }

        const rows = await response.json();
        const value = Array.isArray(rows) && rows.length > 0 ? Number(rows[0].value || 0) : INITIAL_COMPLETED_COUNT;

        if (value <= 0) {
          updateTotalBadge(INITIAL_COMPLETED_COUNT);
          const initResponse = await fetch(`${SUPABASE_URL}/rest/v1/quiz_stats?key=eq.total_completed`, {
            method: 'PATCH',
            headers: supabaseHeaders(),
            body: JSON.stringify({ value: INITIAL_COMPLETED_COUNT })
          });
          if (!initResponse.ok) {
            console.warn('Initial total count seed failed');
          }
          return;
        }

        updateTotalBadge(value);
      } catch (error) {
        console.warn('Global counter fetch failed:', error);
        updateTotalBadge(INITIAL_COMPLETED_COUNT);
      }
    }

    async function incrementGlobalQuizCounter() {
      if (!SUPABASE_URL || !SUPABASE_KEY) return;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/quiz_stats?select=id,value&key=eq.total_completed`, {
          headers: supabaseHeaders()
        });

        if (!response.ok) {
          throw new Error('counter read failed');
        }

        const rows = await response.json();
        const currentRow = Array.isArray(rows) && rows.length > 0 ? rows[0] : null;
        const nextValue = Number(currentRow?.value || INITIAL_COMPLETED_COUNT) + 1;

        if (currentRow) {
          await fetch(`${SUPABASE_URL}/rest/v1/quiz_stats?id=eq.${currentRow.id}`, {
            method: 'PATCH',
            headers: supabaseHeaders(),
            body: JSON.stringify({ value: nextValue })
          });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/quiz_stats`, {
            method: 'POST',
            headers: supabaseHeaders(),
            body: JSON.stringify({ key: 'total_completed', value: nextValue })
          });
        }

        await refreshGlobalQuizCounter();
      } catch (error) {
        console.warn('Increment completed counter failed:', error);
      }
    }

    function startPresenceTracking() {
      if (presenceStarted) return;
      presenceStarted = true;

      const tick = async () => {
        await upsertSession();
        await pruneInactiveSessions();
        await refreshOnlineUsers();
      };

      tick();
      refreshGlobalQuizCounter();

      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(tick, HEARTBEAT_MS);

      if (!window.__quizPresenceBeforeUnloadRegistered) {
        window.__quizPresenceBeforeUnloadRegistered = true;
        window.addEventListener('beforeunload', () => {
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          fetch(`${SUPABASE_URL}/rest/v1/quiz_sessions?session_id=eq.${encodeURIComponent(sessionId)}`, {
            method: 'DELETE',
            headers: supabaseHeaders()
          }).catch(() => {});
        });
      }
    }

    function normalizeCsvHeader(value) {
      return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_|_$/g, '');
    }

    function parseCsvLine(line, separator) {
      const cells = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === separator && !inQuotes) {
          cells.push(current.trim());
          current = '';
          continue;
        }

        current += char;
      }

      cells.push(current.trim());
      return cells;
    }

    function parseCsvRecords(csvText, separator = ';') {
      return csvText
        .replace(/\uFEFF/g, '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .split('\n')
        .map(line => parseCsvLine(line, separator))
        .filter(row => row.some(cell => String(cell || '').trim() !== ''));
    }

    function parseCsvQuestions(csvText) {
      const cleanedText = String(csvText || '').replace(/\uFEFF/g, '');
      if (!cleanedText.trim()) {
        throw new Error('Il file CSV è vuoto.');
      }

      const delimiter = cleanedText.includes(';') ? ';' : ',';
      const rows = parseCsvRecords(cleanedText, delimiter);
      if (rows.length < 2) {
        throw new Error('Il file CSV deve contenere intestazione e almeno una domanda.');
      }

      const headerIndex = rows.findIndex(row =>
        row.some(cell => normalizeCsvHeader(cell).includes('domanda')) &&
        row.some(cell => normalizeCsvHeader(cell).includes('risposta'))
      );

      if (headerIndex === -1) {
        throw new Error('CSV non valido: intestazione non trovata.');
      }

      const normalizedQuestions = rows.slice(headerIndex + 1)
        .map((row, rowIndex) => {
          if (row.length < 5) return null;

          const id = String(row[0] || '').trim();
          const domanda = String(row[1] || '').trim();
          const correct = String(row[2] || '').trim();
          const wrong1 = String(row[3] || '').trim();
          const wrong2 = String(row[4] || '').trim();

          if (!domanda || !correct || !wrong1 || !wrong2) {
            return null;
          }

          const values = [correct, wrong1, wrong2];

          for (let i = values.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [values[i], values[j]] = [values[j], values[i]];
          }

          const opzioni = {
            A: values[0],
            B: values[1],
            C: values[2]
          };
          const risposta_corretta = Object.keys(opzioni).find(key => opzioni[key] === correct) || 'A';

          return {
            id: Number(id) || rowIndex + 1,
            domanda,
            opzioni,
            risposta_corretta
          };
        })
        .filter(Boolean);

      if (normalizedQuestions.length === 0) {
        throw new Error('Nessuna domanda valida trovata nel CSV.');
      }

      return normalizedQuestions;
    }

    async function loadQuestions() {
      try {
        const res = await fetch(DATABASE_FILE);
        if (!res.ok) {
          throw new Error(`${DATABASE_FILE} non trovato`);
        }

        const csvText = await res.text();
        allQuestions = parseCsvQuestions(csvText);
      } catch (err) {
        document.getElementById('question-text').innerText = `Errore durante il caricamento del database CSV ${DATABASE_FILE}`;
      }

      if (allQuestions.length > 0) {
        restartQuiz();
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${mins}:${secs}`;
    }

    function getQuestionBucket(questionId) {
      const id = Number(questionId) || 0;
      if (id <= 1000) return 1;
      if (id <= 2000) return 2;
      if (id <= 3000) return 3;
      if (id <= 4000) return 4;
      return 5;
    }

    function shuffleArray(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildBalancedQuiz(requestedCount) {
      const groups = {
        1: [],
        2: [],
        3: [],
        4: [],
        5: []
      };

      allQuestions.forEach(question => {
        const bucket = getQuestionBucket(question.id);
        if (groups[bucket]) groups[bucket].push(question);
      });

      const availableBuckets = Object.keys(groups)
        .map(Number)
        .filter(bucket => groups[bucket] && groups[bucket].length > 0);

      const selected = [];
      let bucketQueue = shuffleArray(availableBuckets);

      while (selected.length < requestedCount) {
        if (bucketQueue.length === 0) {
          bucketQueue = shuffleArray(availableBuckets);
        }

        const bucket = bucketQueue.shift();
        const bucketQuestions = groups[bucket];

        if (!bucketQuestions || bucketQuestions.length === 0) continue;

        const randomIndex = Math.floor(Math.random() * bucketQuestions.length);
        const question = bucketQuestions.splice(randomIndex, 1)[0];
        selected.push(question);
      }

      return selected;
    }

    function restartQuiz() {
      if (allQuestions.length === 0) return;

      const requestedCount = Math.min(parseInt(document.getElementById('q-count-select').value), allQuestions.length);
      currentQuizQuestions = buildBalancedQuiz(requestedCount);

      currentIndex = 0;
      score = 0;
      userHistory = [];
      
      document.getElementById('current-score').innerText = '0';
      document.getElementById('quiz-header').classList.remove('hidden');
      document.getElementById('quiz-body').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      
      startTimer();
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const q = currentQuizQuestions[currentIndex];
      const total = currentQuizQuestions.length;

      // Aggiorna la barra di progresso
      const progressPercent = ((currentIndex) / total) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      // Badge e Testi
      document.getElementById('question-badge').innerText = `Domanda ${currentIndex + 1}/${total}`;
      document.getElementById('json-id-badge').innerText = `ID: #${q.id}`;
      document.getElementById('database-badge').innerText = `DB: ${DATABASE_FILE}`;
      document.getElementById('question-text').innerText = q.domanda;
      document.getElementById('next-btn').classList.add('hidden');

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      Object.entries(q.opzioni).forEach(([key, text]) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-2xl border border-slate-800 bg-slate-950/40 hover:bg-slate-800/60 hover:border-slate-700 transition-all font-medium flex items-start gap-3.5 group";
        btn.innerHTML = `
          <span class="w-7 h-7 flex-shrink-0 flex items-center justify-center rounded-lg bg-slate-800 group-hover:bg-blue-600/20 text-slate-400 group-hover:text-blue-400 font-semibold text-xs transition-colors border border-slate-700/50 hidden">${key}</span>
          <span class="flex-1 text-sm text-slate-300 group-hover:text-slate-100 pt-0.5 leading-snug">${text}</span>
        `;
        btn.onclick = () => selectOption(btn, key, q);
        container.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, selectedKey, questionObj) {
      if (answered) return;
      answered = true;

      const correctKey = questionObj.risposta_corretta;
      const isCorrect = selectedKey === correctKey;

      if (isCorrect) score++;

      // Salva nella cronologia per il report finale
      userHistory.push({
        question: questionObj.domanda,
        id: questionObj.id,
        userAnswer: selectedKey,
        correctAnswer: correctKey,
        correctText: questionObj.opzioni[correctKey],
        isCorrect: isCorrect
      });

      document.getElementById('current-score').innerText = score;

      const buttons = document.getElementById('options-container').querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);

      if (isCorrect) {
        selectedBtn.className = "w-full text-left p-4 rounded-2xl border border-emerald-500/50 bg-emerald-500/10 text-emerald-200 font-medium flex items-start gap-3.5";
      } else {
        selectedBtn.className = "w-full text-left p-4 rounded-2xl border border-rose-500/50 bg-rose-500/10 text-rose-200 font-medium flex items-start gap-3.5";
        
        buttons.forEach(btn => {
          const keySpan = btn.querySelector('span');
          if (keySpan && keySpan.innerText.trim() === correctKey) {
            btn.className = "w-full text-left p-4 rounded-2xl border border-emerald-500/50 bg-emerald-500/10 text-emerald-200 font-medium flex items-start gap-3.5";
          }
        });
      }

      if (currentIndex < currentQuizQuestions.length - 1) {
        document.getElementById('next-btn').classList.remove('hidden');
      } else {
        setTimeout(showResults, 1000);
      }
    }

    function nextQuestion() {
      currentIndex++;
      showQuestion();
    }

    async function explainWithGemini(item) {
      const explanationBox = document.getElementById(`gemini-explanation-${item.id}`);
      if (!explanationBox) return;

      const button = explanationBox.previousElementSibling;
      if (button) {
        button.disabled = true;
        button.innerText = 'STO SPIEGANDO...';
      }

      try {
        const response = await fetch(GEMINI_FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY
          },
          body: JSON.stringify({
            question: item.question,
            correctText: item.correctText || item.opzioni?.[item.correctAnswer] || 'N/D'
          })
        });

        if (!response.ok) {
          throw new Error('Errore chiamata funzione Gemini');
        }

        const json = await response.json();
        const text = json?.text || 'Non ho ricevuto una spiegazione valida.';
        explanationBox.innerText = text;
      } catch (error) {
        explanationBox.innerText = 'Non ho potuto generare la spiegazione al momento. Controlla la funzione Supabase.';
      } finally {
        if (button) {
          button.disabled = false;
          button.innerText = 'CHIEDI LA SPIEGAZIONE A GEMINI';
        }
      }
    }

    function showResults() {
      clearInterval(timerInterval);
      incrementGlobalQuizCounter();
      document.getElementById('progress-bar').style.width = '100%';
      document.getElementById('quiz-header').classList.add('hidden');
      document.getElementById('quiz-body').classList.add('hidden');
      
      const total = currentQuizQuestions.length;
      const accuracy = Math.round((score / total) * 100);

      document.getElementById('stat-correct').innerText = `${score}/${total}`;
      document.getElementById('stat-accuracy').innerText = `${accuracy}%`;
      document.getElementById('stat-time').innerText = document.getElementById('timer').innerText;

      // Genera lista di revisione
      const reviewContainer = document.getElementById('review-container');
      reviewContainer.innerHTML = '';

      userHistory.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `p-3.5 rounded-xl border text-xs leading-relaxed ${item.isCorrect ? 'bg-emerald-950/20 border-emerald-800/40' : 'bg-rose-950/20 border-rose-800/40'}`;
        const correctText = item.correctText || 'Risposta corretta';

        div.innerHTML = `
          <div class="flex justify-between font-semibold mb-1 gap-2">
            <span class="${item.isCorrect ? 'text-emerald-400' : 'text-rose-400'}">#${index + 1} (ID: #${item.id}) - ${item.isCorrect ? 'Corretta' : 'Errata'}</span>
            <span class="text-slate-400 text-right">${item.isCorrect ? 'Scelta: Corretta' : `Scelta: Sbagliata`}</span>
          </div>
          <div class="text-slate-300 line-clamp-2">${item.question}</div>
          ${!item.isCorrect ? `<div class="mt-2 text-emerald-300"><span class="font-semibold">Giusta:</span> ${correctText}</div>` : ''}
          ${!item.isCorrect ? `
            <button type="button" class="mt-3 w-full rounded-lg border border-slate-700 bg-slate-800/80 px-2 py-1.5 text-[10px] uppercase tracking-[0.12em] text-slate-200 transition-colors hover:bg-slate-700">
              CHIEDI LA SPIEGAZIONE A GEMINI
            </button>
            <div id="gemini-explanation-${item.id}" class="mt-2 hidden text-[11px] leading-relaxed text-slate-300"></div>
          ` : ''}
        `;

        if (!item.isCorrect) {
          const explainButton = div.querySelector('button');
          const explanationBox = div.querySelector('div[id^="gemini-explanation-"]');
          explainButton.addEventListener('click', async () => {
            if (explanationBox) {
              explanationBox.classList.remove('hidden');
              explanationBox.innerText = 'Sto preparando la spiegazione...';
            }
            await explainWithGemini(item);
          });
        }

        reviewContainer.appendChild(div);
      });

      document.getElementById('result-screen').classList.remove('hidden');
    }

    startPresenceTracking();
    loadQuestions();
  </script>
</body>
</html>
