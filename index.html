<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Interactive</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div id="quiz-card" class="bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 max-w-2xl w-full border border-slate-700">
    <!-- Status Header -->
    <div id="status-bar" class="flex justify-between items-center mb-6 text-sm text-slate-400 font-semibold">
      <span id="question-number">Domanda 1</span>
      <div class="flex items-center gap-3">
        <span id="score">Punteggio: 0</span>
        <button onclick="restartQuiz()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200 transition-all font-medium">
          ↺ Riavvia
        </button>
      </div>
    </div>
    
    <!-- Domanda -->
    <h2 id="question-text" class="text-xl md:text-2xl font-bold mb-6 text-slate-100 leading-snug">Caricamento...</h2>
    
    <!-- Opzioni -->
    <div id="options-container" class="space-y-3 mb-6"></div>
    
    <!-- Bottone Avanti -->
    <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-xl transition-all">
      Prossima Domanda
    </button>

    <!-- Schermata Finale -->
    <div id="result-screen" class="hidden text-center py-6">
      <h2 class="text-3xl font-bold mb-4 text-emerald-400">Quiz Completato!</h2>
      <p id="final-score" class="text-xl mb-6 text-slate-300"></p>
      <button onclick="restartQuiz()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition-all">
        Ricomincia con altre 5 domande
      </button>
    </div>
  </div>

  <script>
    let allQuestions = [];
    let currentQuizQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    async function loadQuestions() {
      try {
        const res = await fetch('questions.json');
        allQuestions = await res.json();
        restartQuiz();
      } catch (err) {
        document.getElementById('question-text').innerText = "Errore nel caricamento del file questions.json";
      }
    }

    function restartQuiz() {
      if (allQuestions.length === 0) return;

      // Mescola l'intero array e seleziona 5 domande casuali
      const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
      currentQuizQuestions = shuffled.slice(0, Math.min(5, allQuestions.length));

      currentIndex = 0;
      score = 0;
      
      document.getElementById('score').innerText = `Punteggio: 0`;
      document.getElementById('status-bar').classList.remove('hidden');
      document.getElementById('question-text').classList.remove('hidden');
      document.getElementById('options-container').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const q = currentQuizQuestions[currentIndex];
      document.getElementById('question-number').innerText = `Domanda ${currentIndex + 1} di ${currentQuizQuestions.length}`;
      document.getElementById('question-text').innerText = q.domanda;
      document.getElementById('next-btn').classList.add('hidden');

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      Object.entries(q.opzioni).forEach(([key, text]) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800/60 hover:bg-slate-700 transition-all font-medium flex items-start gap-3";
        btn.innerHTML = `<span class="bg-slate-700 text-blue-400 px-2.5 py-1 rounded-lg font-bold text-sm">${key}</span> <span class="flex-1">${text}</span>`;
        btn.onclick = () => selectOption(btn, key, q.risposta_corretta);
        container.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, selectedKey, correctKey) {
      if (answered) return;
      answered = true;

      const buttons = document.getElementById('options-container').querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);

      if (selectedKey === correctKey) {
        selectedBtn.classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
        score++;
        document.getElementById('score').innerText = `Punteggio: ${score}`;
      } else {
        selectedBtn.classList.add('bg-rose-950', 'border-rose-500', 'text-rose-300');
        buttons.forEach(btn => {
          if (btn.querySelector('span').innerText === correctKey) {
            btn.classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
          }
        });
      }

      if (currentIndex < currentQuizQuestions.length - 1) {
        document.getElementById('next-btn').classList.remove('hidden');
      } else {
        setTimeout(showResults, 1200);
      }
    }

    function nextQuestion() {
      currentIndex++;
      showQuestion();
    }

    function showResults() {
      document.getElementById('status-bar').classList.add('hidden');
      document.getElementById('question-text').classList.add('hidden');
      document.getElementById('options-container').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');
      
      const resultScreen = document.getElementById('result-screen');
      resultScreen.classList.remove('hidden');
      document.getElementById('final-score').innerText = `Hai risposto correttamente a ${score} su ${currentQuizQuestions.length} domande.`;
    }

    loadQuestions();
  </script>
</body>
</html>
